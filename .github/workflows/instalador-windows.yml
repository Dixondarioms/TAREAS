name: Instalador Windows

on:
  pull_request:
    paths: ['ferreteria/**', '.github/workflows/instalador-windows.yml']
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar el instalador en la página de versiones (Releases)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  construir:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ferreteria/backend/package-lock.json
            ferreteria/frontend/package-lock.json
      - name: Compilar API
        working-directory: ferreteria/backend
        shell: bash
        run: npm ci && npm run build && npm prune --omit=dev
      - name: Compilar aplicación web
        working-directory: ferreteria/frontend
        shell: bash
        run: npm ci && npm run build
      - name: Versión
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./ferreteria/backend/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Reunir Node, PostgreSQL y la aplicación
        run: ./ferreteria/instalador-windows/preparar.ps1
      - name: Compilar el instalador (Inno Setup)
        working-directory: ferreteria/instalador-windows
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          & $iscc "/DVersionApp=${{ steps.version.outputs.version }}" instalador.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem salida | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: ferreteria/instalador-windows/salida/*.exe
          if-no-files-found: error

  probar:
    needs: construir
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: instalador-windows
          path: instalador
      - name: Instalar, usar, actualizar y desinstalar
        run: |
          $exe = (Get-ChildItem instalador\*.exe | Select-Object -First 1).FullName
          ./ferreteria/instalador-windows/probar.ps1 -Instalador $exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registros-prueba-instalador
          path: ${{ runner.temp }}/registros-instalador

  publicar:
    needs: [construir, probar]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador-windows
          path: instalador
      - name: Crear la versión con el instalador
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.construir.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ETIQUETA="${GITHUB_REF#refs/tags/}"; EXTRA=""
          else
            ETIQUETA="instalador-$VERSION-$GITHUB_RUN_NUMBER"; EXTRA="--prerelease"
          fi
          gh release create "$ETIQUETA" instalador/*.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $EXTRA \
            --title "La Casa del Inyector $VERSION — instalador para Windows" \
            --notes "Descargue el archivo .exe y ejecútelo como administrador en el equipo que será el servidor de la tienda. Si Windows muestra «Windows protegió su PC», pulse «Más información» y luego «Ejecutar de todas formas»."
